<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070B12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Macro Diary">
  <meta name="format-detection" content="telephone=no">
  <title>Macro Diary</title>
  <link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app" id="app">
    <header id="topbar" class="topbar"></header>
    <main id="main"></main>
    <div id="dock" class="dock" hidden></div>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>
    <div id="sheet-root"></div>
    <div id="toast-root"></div>
  </div>
  <noscript>Macro Diary needs JavaScript to run.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
